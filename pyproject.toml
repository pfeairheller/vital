# $ python setup.py register sdist upload

# First Time register project on pypi
# https://pypi.org/manage/projects/
#
#
# Pypi Release
# $ pip3 install twine
#
# $ python3 -m build
# $ twine upload dist/*

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vital"
version = "0.0.1"
description = "Verifiable Identity and Trust Automation Layer"
readme = "README.md"
requires-python = ">=3.13.3"
authors = [
    {name = "Phil Feairheller", email = "phil@healthKERI.com"}
]

dependencies = [
    "keri~=1.3.6",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.0.0",
]

[dependency-groups]
dev = []
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0"
]

# Sentinel handler tests (requires sentinel-handler extra)
test-sentinel = [
    { include-group = "test" },
]

[project.urls]
Homepage = "https://github.com/healthKERI/vital"

[project.scripts]
vital = "vital.app.cli.vital:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

